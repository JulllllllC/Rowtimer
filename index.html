<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rowtimer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1A1A18">
<title>Rowtimer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  svg { display: inline-block; vertical-align: middle; flex-shrink: 0; }
  .cbtn svg, .mbtn svg { width: 20px; height: 20px; }
  .nav-btn svg { width: 20px; height: 20px; }
  .boat-act-btn svg { width: 16px; height: 16px; }
  .save-big-btn svg { width: 18px; height: 18px; }
  .sess-act svg { width: 14px; height: 14px; }
  .boat-del-btn svg { width: 14px; height: 14px; }
  .topbar-icon svg { width: 16px; height: 16px; }
  .hist-empty svg { width: 36px; height: 36px; }
  .sess-name svg { width: 13px; height: 13px; vertical-align: -1px; margin-right: 4px; }
  :root {
    --green: #1D9E75;
    --green-light: #E1F5EE;
    --green-dark: #0F6E56;
    --red: #D85A30;
    --blue: #378ADD;
    --purple: #7F77DD;
    --gray: #888780;
    --bg: #F7F6F2;
    --bg2: #EFEDE8;
    --bg3: #E5E3DC;
    --text: #1A1A18;
    --text2: #666660;
    --text3: #AAAAА4;
    --border: #DDDBD4;
    --mono: 'DM Mono', monospace;
    --sans: 'Outfit', sans-serif;
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%; width: 100%;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }

  .app {
    display: flex; flex-direction: column;
    height: 100dvh; max-width: 430px;
    margin: 0 auto;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  /* ── TOP BAR ── */
  .topbar {
    background: var(--text);
    padding: env(safe-area-inset-top, 12px) 16px 10px;
    padding-top: max(env(safe-area-inset-top), 12px);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .topbar-logo { display: flex; align-items: center; gap: 8px; }
  .topbar-icon { width: 28px; height: 28px; background: var(--green); border-radius: 7px; display: flex; align-items: center; justify-content: center; }
  .topbar-icon i { font-size: 16px; color: #fff; }
  .topbar-name { font-size: 15px; font-weight: 600; color: #fff; letter-spacing: -0.3px; }
  .topbar-sub { font-size: 11px; color: rgba(255,255,255,0.4); }

  /* ── NAV ── */
  .nav {
    display: flex;
    background: var(--text);
    border-top: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
  }
  .nav-btn {
    flex: 1; padding: 8px 4px 10px;
    background: none; border: none; cursor: pointer;
    font-size: 10px; font-weight: 500; font-family: var(--sans);
    color: rgba(255,255,255,0.35);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    border-bottom: 2px solid transparent;
    transition: color 0.15s;
    letter-spacing: 0.2px;
  }
  .nav-btn i { font-size: 20px; }
  .nav-btn.active { color: var(--green); border-bottom-color: var(--green); }

  /* ── SCREENS ── */
  .screen { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .screen.active { display: flex; }

  /* ── CHRONO SCREEN ── */
  .chrono-wrap {
    flex: 1; display: flex; flex-direction: column;
    overflow: hidden;
  }

  .clock-hero {
    background: var(--text);
    padding: 20px 20px 16px;
    text-align: center;
    flex-shrink: 0;
  }
  .clock-label {
    font-size: 10px; font-weight: 600; letter-spacing: 1.5px;
    color: rgba(255,255,255,0.3); text-transform: uppercase; margin-bottom: 6px;
  }
  .clock-display {
    font-family: var(--mono);
    font-size: 56px; font-weight: 500;
    color: #fff; letter-spacing: -1px; line-height: 1;
    display: flex; align-items: baseline; justify-content: center; gap: 0;
  }
  .clock-display .cc { font-size: 34px; color: rgba(255,255,255,0.45); }
  .clock-split {
    font-family: var(--mono); font-size: 14px;
    color: rgba(255,255,255,0.4); margin-top: 6px;
  }
  .clock-rate {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 10px;
    background: rgba(255,255,255,0.07);
    border-radius: 20px; padding: 5px 14px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .clock-rate-val { font-family: var(--mono); font-size: 16px; font-weight: 500; color: var(--green); }
  .clock-rate-lbl { font-size: 11px; color: rgba(255,255,255,0.35); }
  .clock-rate-sep { width: 1px; height: 14px; background: rgba(255,255,255,0.12); }

  /* Boutons chrono */
  .chrono-btns { padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
  .btn-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

  .cbtn {
    border: 1.5px solid var(--border);
    background: #fff;
    border-radius: var(--radius-sm);
    padding: 11px 6px 9px;
    font-size: 11px; font-weight: 600; font-family: var(--sans);
    color: var(--text2); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    transition: transform 0.08s, background 0.1s;
    letter-spacing: 0.2px;
    user-select: none;
  }
  .cbtn:active { transform: scale(0.95); background: var(--bg2); }
  .cbtn i { font-size: 18px; }
  .cbtn.c-go { border-color: var(--green); color: var(--green); background: var(--green-light); }
  .cbtn.c-pause { border-color: var(--red); color: var(--red); background: #FDEEE8; }
  .cbtn.c-split { border-color: var(--blue); color: var(--blue); background: #E8F2FD; }
  .cbtn.c-rate { border-color: var(--purple); color: var(--purple); background: #EEEDF9; }
  .cbtn.c-seg { border-color: var(--gray); color: var(--gray); background: var(--bg2); }
  .cbtn.c-reset { border-color: #E24B4A; color: #E24B4A; background: #FDE8E8; }

  /* Splits */
  .splits-panel {
    flex: 1; overflow: hidden;
    display: flex; flex-direction: column;
    margin: 0 14px 10px;
    background: #fff;
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }
  .splits-head {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    flex-shrink: 0;
  }
  .splits-head-lbl { font-size: 10px; font-weight: 600; letter-spacing: 1px; color: var(--text2); text-transform: uppercase; }
  .seg-pill {
    font-size: 10px; background: var(--bg2); border: 1px solid var(--border);
    border-radius: 20px; padding: 2px 9px; color: var(--text2); font-weight: 500;
  }
  .splits-scroll { overflow-y: auto; flex: 1; }
  .split-item {
    display: flex; align-items: center; gap: 0;
    padding: 5px 12px;
    border-bottom: 1px solid var(--bg2);
    font-size: 12px;
  }
  .split-item.fresh { background: var(--green-light); }
  .split-item .si-num { color: var(--text2); width: 26px; font-weight: 500; }
  .split-item .si-lap { font-family: var(--mono); font-weight: 500; color: var(--text); flex: 1; }
  .split-item .si-spm { font-family: var(--mono); color: var(--text2); width: 56px; text-align: right; }
  .split-item .si-cum { font-family: var(--mono); color: var(--text2); width: 70px; text-align: right; }
  .splits-empty { padding: 24px; text-align: center; font-size: 12px; color: var(--text2); }

  .status-row {
    padding: 5px 14px;
    display: flex; justify-content: space-between;
    flex-shrink: 0;
  }
  .status-row span { font-size: 10px; color: var(--text2); display: flex; align-items: center; gap: 4px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
  .dot.on { background: var(--green); }
  .dot.off { background: var(--red); }

  /* ── MULTI SCREEN ── */
  .multi-top {
    padding: 10px;
    display: flex; gap: 6px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .mbtn {
    flex: 1; border: 1.5px solid var(--border); background: #fff;
    border-radius: var(--radius-sm); padding: 9px 3px 7px;
    font-size: 10px; font-weight: 600; font-family: var(--sans);
    color: var(--text2); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    user-select: none; letter-spacing: 0.2px; line-height: 1.2;
  }
  .mbtn:active { transform: scale(0.95); }
  .mbtn i { font-size: 18px; display: block; }
  .mbtn.m-go { border-color: var(--green); color: var(--green); }
  .mbtn.m-stp { border-color: var(--red); color: var(--red); }
  .mbtn.m-add { border-color: var(--blue); color: var(--blue); }
  .mbtn.m-rst { border-color: var(--gray); color: var(--gray); }

  .boats-scroll { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }

  .boat-card {
    background: #fff; border-radius: var(--radius);
    border: 1.5px solid var(--border);
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .boat-card.running { border-color: var(--green); }
  .boat-card.finished { border-color: var(--gray); opacity: 0.8; }

  .boat-top {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
  }
  .boat-color-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .boat-name-input {
    flex: 1; font-size: 12px; font-weight: 600; font-family: var(--sans);
    background: transparent; border: none; outline: none; color: var(--text);
  }
  .boat-status-lbl { font-size: 10px; color: var(--text2); flex-shrink: 0; }
  .boat-del-btn { background: none; border: none; cursor: pointer; color: var(--text2); font-size: 14px; padding: 0 2px; }

  .boat-main { display: flex; align-items: stretch; }
  .boat-chrono { flex: 1; padding: 8px 10px; }
  .boat-time-big { font-family: var(--mono); font-size: 26px; font-weight: 500; }
  .boat-last-split { font-size: 10px; color: var(--text2); font-family: var(--mono); margin-top: 2px; }
  .boat-actions { display: flex; flex-direction: column; border-left: 1px solid var(--border); }
  .boat-act-btn {
    flex: 1; background: none; border: none; cursor: pointer;
    padding: 0 13px; font-size: 10px; font-weight: 500; font-family: var(--sans);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    color: var(--text2); user-select: none;
  }
  .boat-act-btn:active { background: var(--bg2); }
  .boat-act-btn i { font-size: 15px; }
  .boat-act-btn.ba-go { color: var(--green); border-bottom: 1px solid var(--border); }
  .boat-act-btn.ba-stp { color: var(--red); border-bottom: 1px solid var(--border); }
  .boat-act-btn.ba-spl { color: var(--blue); }

  .boat-chips { padding: 4px 10px 7px; display: flex; flex-wrap: wrap; gap: 4px; }
  .boat-chip {
    font-size: 10px; font-family: var(--mono);
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 20px; padding: 1px 7px; color: var(--text2);
  }
  .boat-chip.fresh { border-color: var(--green); color: var(--green-dark); background: var(--green-light); }

  .multi-footer {
    padding: 6px 12px;
    background: var(--bg2); border-top: 1px solid var(--border);
    display: flex; justify-content: space-between;
    flex-shrink: 0;
  }
  .multi-footer span { font-size: 10px; color: var(--text2); font-weight: 500; }

  .save-row { padding: 8px 12px; border-top: 1px solid var(--border); flex-shrink: 0; }
  .save-big-btn {
    width: 100%; padding: 12px;
    background: var(--green); color: #fff;
    border: none; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 600; font-family: var(--sans);
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px;
    letter-spacing: 0.2px;
  }
  .save-big-btn:active { transform: scale(0.98); opacity: 0.92; }
  .save-big-btn i { font-size: 17px; }

  /* ── HISTORIQUE ── */
  .hist-scroll { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .hist-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--text2); font-size: 13px; }
  .hist-empty i { font-size: 36px; color: var(--border); }

  .sess-card { background: #fff; border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
  .sess-top { background: var(--bg2); padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
  .sess-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .sess-dt { font-size: 10px; color: var(--text2); }
  .sess-stats { display: flex; gap: 0; padding: 8px 12px; }
  .sess-stat { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .sess-stat + .sess-stat { border-left: 1px solid var(--border); padding-left: 12px; }
  .sess-stat-v { font-size: 15px; font-weight: 600; font-family: var(--mono); color: var(--text); }
  .sess-stat-l { font-size: 10px; color: var(--text2); }
  .sess-boats-list { padding: 0 12px 8px; display: flex; flex-direction: column; gap: 3px; }
  .sess-boat { display: flex; align-items: center; gap: 6px; font-size: 11px; }
  .sess-boat-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .sess-boat-name { flex: 1; color: var(--text2); }
  .sess-boat-t { font-family: var(--mono); font-weight: 600; color: var(--text); }
  .sess-boat-s { color: var(--text2); font-size: 10px; }
  .sess-acts { border-top: 1px solid var(--border); display: flex; }
  .sess-act { flex: 1; background: none; border: none; cursor: pointer; padding: 8px 4px; font-size: 11px; font-weight: 500; font-family: var(--sans); color: var(--blue); display: flex; align-items: center; justify-content: center; gap: 4px; }
  .sess-act:active { background: var(--bg2); }
  .sess-act + .sess-act { border-left: 1px solid var(--border); }
  .sess-act.del { color: #E24B4A; }
  .sess-act i { font-size: 13px; }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: calc(60px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    background: var(--text); color: #fff;
    font-size: 12px; font-weight: 500; font-family: var(--sans);
    padding: 8px 18px; border-radius: 20px;
    white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity 0.2s; z-index: 100;
  }
  .toast.show { opacity: 1; }

  /* ── EMPTY STATE ── */
  .empty-state { padding: 28px 16px; text-align: center; font-size: 12px; color: var(--text2); }
  .empty-state strong { display: block; font-size: 13px; color: var(--text); margin-bottom: 4px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<div class="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-logo">
      <div class="topbar-icon"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4"/><path d="M12 14m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"/><path d="M12 10v4l2 2"/><path d="M5.5 5.5l-1 1"/><path d="M12 6v-4"/></svg></div>
      <div>
        <div class="topbar-name">Rowtimer</div>
      </div>
    </div>
    <div id="topbar-right" style="font-size:10px;color:rgba(255,255,255,0.35)"></div>
  </div>

  <!-- NAV -->
  <div class="nav">
    <button class="nav-btn active" id="nav-chrono" onclick="showScreen('chrono')">
      <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4"/><path d="M12 14m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"/><path d="M12 10v4l2 2"/><path d="M5.5 5.5l-1 1"/><path d="M12 6v-4"/></svg>Chrono
    </button>
    <button class="nav-btn" id="nav-multi" onclick="showScreen('multi')">
      <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15c0 0 2 2 9 2s9 -2 9 -2"/><path d="M3 15l1.5 3h15l1.5 -3"/><path d="M6 9l-3 -4"/><path d="M18 9l3 -4"/><path d="M6 9h12"/><path d="M6 9c0 -2 2 -3 6 -3s6 1 6 3"/></svg>Multi
    </button>
    <button class="nav-btn" id="nav-hist" onclick="showScreen('hist')">
      <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8l0 4l2 2"/><path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"/></svg>Historique
    </button>
  </div>

  <!-- ═══ CHRONO ═══ -->
  <div class="screen active" id="screen-chrono">
    <div class="chrono-wrap">
      <div class="clock-hero">
        <div class="clock-label">Chrono principal</div>
        <div class="clock-display" id="main-time">00:00<span class="cc">.00</span></div>
        <div class="clock-split" id="split-time">dernier split : —</div>
        <div class="clock-rate">
          <span class="clock-rate-val" id="rate-val">—</span>
          <span class="clock-rate-lbl">spm</span>
          <div class="clock-rate-sep"></div>
          <span class="clock-rate-lbl" id="rate-sec">—</span>
        </div>
      </div>

      <div class="chrono-btns">
        <div class="btn-row2">
          <button class="cbtn c-go" id="btn-start" onclick="chronoStartStop()">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16l13 -8z"/></svg>Démarrer
          </button>
          <button class="cbtn c-split" onclick="chronoSplit()">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5a5 5 0 0 1 7 0a5 5 0 0 0 7 0v9a5 5 0 0 1 -7 0a5 5 0 0 0 -7 0v-9z"/><path d="M5 21v-7"/></svg>Split
          </button>
        </div>
        <div class="btn-row3">
          <button class="cbtn c-rate" onclick="chronoRate()">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c0 -2.4 1.3 -4 2.4 -4c1.1 0 1.8 .8 2.6 2c.8 1.2 1.5 2 2.6 2c1.1 0 1.8 -.8 2.6 -2c.8 -1.2 1.5 -2 2.6 -2c1.1 0 1.8 .8 2.6 2c.8 1.2 1.5 2 2.6 2c1.1 0 1.8 -.8 2.6 -2c.8 -1.2 1.5 -2 2.6 -2"/></svg>Cadence
          </button>
          <button class="cbtn c-seg" onclick="chronoNewSeg()">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l14 0"/><path d="M13 18l6 -6"/><path d="M13 6l6 6"/></svg>Segment
          </button>
          <button class="cbtn c-reset" onclick="chronoReset()">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg>Reset
          </button>
        </div>
      </div>

      <div class="splits-panel">
        <div class="splits-head">
          <span class="splits-head-lbl">Splits</span>
          <span class="seg-pill" id="seg-badge">Segment 1</span>
        </div>
        <div class="splits-scroll" id="splits-list">
          <div class="splits-empty">Lance le chrono pour enregistrer des splits</div>
        </div>
      </div>

      <div class="status-row">
        <span><span class="dot" id="cdot"></span><span id="cstatus">Arrêté</span></span>
        <span id="ctotals">0 splits · 0 seg</span>
      </div>
    </div>
    <div class="save-row">
      <button class="save-big-btn" onclick="saveChronoSession()">
        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h10l4 4v10a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2"/><path d="M12 14m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M14 4l0 4l-6 0l0 -4"/></svg>Sauvegarder la séance
      </button>
    </div>
  </div>

  <!-- ═══ MULTI ═══ -->
  <div class="screen" id="screen-multi">
    <div class="multi-top">
      <button class="mbtn m-go" onclick="mStartAll()"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16l13 -8z"/></svg>Départ groupé</button>
      <button class="mbtn m-stp" onclick="mStopAll()"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5m0 2a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2z"/></svg>Arrêt général</button>
      <button class="mbtn m-add" id="btn-add" onclick="mAddBoat()"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5l0 14"/><path d="M5 12l14 0"/></svg>Équipage</button>
      <button class="mbtn m-rst" onclick="mResetAll()"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg>Reset</button>
    </div>
    <div class="boats-scroll" id="boats-list">
      <div class="empty-state"><strong>Aucun équipage</strong>Appuie sur Équipage pour ajouter un bateau</div>
    </div>
    <div class="multi-footer">
      <span id="m-running">0 en course</span>
      <span id="m-finished">0 arrivé</span>
    </div>
    <div class="save-row">
      <button class="save-big-btn" onclick="saveSession()">
        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h10l4 4v10a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2"/><path d="M12 14m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M14 4l0 4l-6 0l0 -4"/></svg>Sauvegarder la séance
      </button>
    </div>
  </div>

  <!-- ═══ HISTORIQUE ═══ -->
  <div class="screen" id="screen-hist">
    <div class="hist-scroll" id="hist-content">
      <div class="hist-empty"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.983 8.978c-.383 .028 -.772 .042 -1.164 .042c-3.48 0 -7 -1.12 -7 -3s3.52 -3 7 -3s7 1.12 7 3"/><path d="M11.18 17.004c-3.274 -.086 -7.18 -1.187 -7.18 -3.004v-6"/><path d="M20 12v.5"/><path d="M20 18v.01"/><path d="M3 3l18 18"/></svg>Aucune séance sauvegardée</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const COLORS = ['#1D9E75','#378ADD','#D85A30','#7F77DD','#BA7517','#D4537E'];

/* ── NAV ── */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  document.getElementById('nav-' + id).classList.add('active');
  if (id === 'hist') renderHist();
}

/* ── UTILS ── */
function pad2(n) { return String(Math.floor(Math.abs(n))).padStart(2,'0'); }

function fmt(ms) {
  const t = Math.floor(ms);
  const m = Math.floor(t / 60000);
  const s = Math.floor((t % 60000) / 1000);
  const c = Math.floor((t % 1000) / 10);
  return pad2(m) + ':' + pad2(s) + '.' + pad2(c);
}
function fmtHTML(ms) {
  const t = Math.floor(ms);
  const m = Math.floor(t / 60000);
  const s = Math.floor((t % 60000) / 1000);
  const c = Math.floor((t % 1000) / 10);
  return pad2(m) + ':' + pad2(s) + '<span class="cc">.' + pad2(c) + '</span>';
}
function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}) + ' ' +
         d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

/* ══════════════════════
   CHRONO PRINCIPAL
══════════════════════ */
let cRunning = false, cStart = null, cElapsed = 0, cRafId = null;
let cSplitStart = 0, cSplits = [], cSeg = 1, cTotalSplits = 0;
let cLastRateTime = null, cLastRate = null;

function chronoTick() {
  cElapsed = performance.now() - cStart;
  document.getElementById('main-time').innerHTML = fmtHTML(cElapsed);
  if (cRunning) cRafId = requestAnimationFrame(chronoTick);
}

function chronoStartStop() {
  if (!cRunning) {
    cRunning = true;
    cStart = performance.now() - cElapsed;
    cRafId = requestAnimationFrame(chronoTick);
    document.getElementById('btn-start').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5m0 1a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1z"/><path d="M14 5m0 1a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1z"/></svg>Pause';
    document.getElementById('btn-start').className = 'cbtn c-pause';
    document.getElementById('cdot').className = 'dot on';
    document.getElementById('cstatus').textContent = 'En cours';
  } else {
    cRunning = false;
    cElapsed = performance.now() - cStart;
    cancelAnimationFrame(cRafId);
    document.getElementById('main-time').innerHTML = fmtHTML(cElapsed);
    document.getElementById('btn-start').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16l13 -8z"/></svg>Reprendre';
    document.getElementById('btn-start').className = 'cbtn c-go';
    document.getElementById('cdot').className = 'dot off';
    document.getElementById('cstatus').textContent = 'Pause';
  }
}

function chronoSplit() {
  if (!cRunning && cElapsed === 0) return;
  const now = cRunning ? performance.now() - cStart : cElapsed;
  const lap = now - cSplitStart;
  cSplitStart = now;
  cSplits.push({ lap, cumul: now, seg: cSeg, rate: cLastRate });
  cTotalSplits++;
  document.getElementById('split-time').textContent = 'dernier split : ' + fmt(lap);
  renderCSplits(); updateCCounters();
}

function chronoRate() {
  const now = performance.now();
  if (cLastRateTime !== null) {
    const i = now - cLastRateTime;
    cLastRate = Math.round(60000 / i);
    document.getElementById('rate-val').textContent = cLastRate;
    document.getElementById('rate-sec').textContent = (i / 1000).toFixed(2) + 's';
  }
  cLastRateTime = now;
}

function chronoNewSeg() {
  if (!cSplits.filter(s => s.seg === cSeg).length) return;
  cSeg++;
  cSplitStart = cRunning ? performance.now() - cStart : cElapsed;
  cLastRateTime = null;
  document.getElementById('seg-badge').textContent = 'Segment ' + cSeg;
  updateCCounters();
}

function chronoReset() {
  cRunning = false; cancelAnimationFrame(cRafId);
  cElapsed = 0; cSplitStart = 0; cSplits = []; cSeg = 1; cTotalSplits = 0;
  cLastRateTime = null; cLastRate = null;
  document.getElementById('main-time').innerHTML = '00:00<span class="cc">.00</span>';
  document.getElementById('split-time').textContent = 'dernier split : —';
  document.getElementById('rate-val').textContent = '—';
  document.getElementById('rate-sec').textContent = '—';
  document.getElementById('btn-start').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16l13 -8z"/></svg>Démarrer';
  document.getElementById('btn-start').className = 'cbtn c-go';
  document.getElementById('cdot').className = 'dot';
  document.getElementById('cstatus').textContent = 'Arrêté';
  document.getElementById('seg-badge').textContent = 'Segment 1';
  document.getElementById('splits-list').innerHTML = '<div class="splits-empty">Lance le chrono pour enregistrer des splits</div>';
  updateCCounters();
}

function renderCSplits() {
  const list = document.getElementById('splits-list');
  const seg = cSplits.filter(s => s.seg === cSeg);
  if (!seg.length) { list.innerHTML = '<div class="splits-empty">Aucun split dans ce segment</div>'; return; }
  list.innerHTML = seg.slice().reverse().map((s, i, a) => `
    <div class="split-item${i === 0 ? ' fresh' : ''}">
      <span class="si-num">#${a.length - i}</span>
      <span class="si-lap">${fmt(s.lap)}</span>
      <span class="si-spm">${s.rate ? s.rate + ' spm' : '—'}</span>
      <span class="si-cum">${fmt(s.cumul)}</span>
    </div>`).join('');
}

function updateCCounters() {
  const sc = cSplits.filter(s => s.seg === cSeg).length;
  document.getElementById('seg-counter') && (document.getElementById('seg-counter').textContent = 'Seg ' + cSeg + ' · ' + sc);
  document.getElementById('ctotals').textContent = cTotalSplits + ' splits · ' + cSeg + ' seg';
  document.getElementById('topbar-right').textContent = 'Seg ' + cSeg + ' · ' + sc + ' split' + (sc > 1 ? 's' : '');
}

/* ══════════════════════
   MULTI-BATEAUX
══════════════════════ */
let boats = [], nextId = 1, mInterval = null;

function mAddBoat() {
  if (boats.length >= 6) { showToast('Maximum 6 équipages'); return; }
  boats.push({
    id: nextId++,
    name: 'Équipage ' + (boats.length + 1),
    color: COLORS[boats.length % COLORS.length],
    running: false, finished: false,
    startTime: null, elapsed: 0,
    splitStart: 0, splits: [], lastSplit: null
  });
  if (boats.length >= 6) document.getElementById('btn-add').style.opacity = '0.4';
  mRenderAll(); mStartTicker();
}

function mStartTicker() {
  if (mInterval) return;
  mInterval = setInterval(() => {
    let any = false;
    boats.forEach(b => {
      if (b.running) {
        any = true;
        b.elapsed = performance.now() - b.startTime;
        const el = document.getElementById('mbt-' + b.id);
        if (el) el.textContent = fmt(b.elapsed);
      }
    });
    if (!any) { clearInterval(mInterval); mInterval = null; }
    mUpdateFooter();
  }, 10);
}

function mStartAll() {
  const now = performance.now();
  boats.forEach(b => { if (!b.running && !b.finished) { b.running = true; b.startTime = now - b.elapsed; } });
  mStartTicker(); mRenderAll();
}
function mStopAll() {
  boats.forEach(b => { if (b.running) { b.elapsed = performance.now() - b.startTime; b.running = false; b.finished = true; } });
  mRenderAll();
}
function mResetAll() {
  boats = []; nextId = 1;
  if (mInterval) { clearInterval(mInterval); mInterval = null; }
  document.getElementById('btn-add').style.opacity = '1';
  mRenderAll();
}
function mStartBoat(id) {
  const b = boats.find(x => x.id === id); if (!b || b.finished) return;
  b.running = true; b.startTime = performance.now() - b.elapsed;
  mStartTicker(); mRenderBoat(b);
}
function mStopBoat(id) {
  const b = boats.find(x => x.id === id); if (!b || !b.running) return;
  b.elapsed = performance.now() - b.startTime; b.running = false; b.finished = true;
  mRenderBoat(b); mUpdateFooter();
}
function mSplitBoat(id) {
  const b = boats.find(x => x.id === id); if (!b || !b.running) return;
  const now = performance.now() - b.startTime;
  const lap = now - b.splitStart;
  b.splitStart = now; b.splits.push(lap); b.lastSplit = lap;
  mRenderBoat(b);
}
function mRemoveBoat(id) {
  boats = boats.filter(x => x.id !== id);
  if (boats.length < 6) document.getElementById('btn-add').style.opacity = '1';
  mRenderAll();
}
function mRenameBoat(id, val) { const b = boats.find(x => x.id === id); if (b) b.name = val; }

function mBoatHTML(b) {
  const stClass = b.finished ? 'finished' : b.running ? 'running' : '';
  const stateTxt = b.finished ? 'Arrivé' : b.running ? 'En course' : 'En attente';
  const actionBtn = b.finished
    ? `<button class="boat-act-btn" style="cursor:default;color:var(--gray)"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5l10 -10"/></svg>Fini</button>`
    : b.running
      ? `<button class="boat-act-btn ba-stp" onclick="mStopBoat(${b.id})"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5m0 2a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2z"/></svg>Stop</button>`
      : `<button class="boat-act-btn ba-go" onclick="mStartBoat(${b.id})"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16l13 -8z"/></svg>Go</button>`;
  const chips = b.splits.map((s, i) => `<span class="boat-chip${i === b.splits.length - 1 ? ' fresh' : ''}">#${i+1} ${fmt(s)}</span>`).join('');
  return `<div class="boat-card ${stClass}" id="mboat-${b.id}">
    <div class="boat-top">
      <div class="boat-color-dot" style="background:${b.color}"></div>
      <input class="boat-name-input" value="${b.name}" onchange="mRenameBoat(${b.id},this.value)" placeholder="Nom de l'équipage…"/>
      <span class="boat-status-lbl">${stateTxt}</span>
      <button class="boat-del-btn" onclick="mRemoveBoat(${b.id})" aria-label="Supprimer"><svg style="font-size:13px" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg></button>
    </div>
    <div class="boat-main">
      <div class="boat-chrono">
        <div class="boat-time-big" id="mbt-${b.id}" style="color:${b.color}">${fmt(b.elapsed)}</div>
        ${b.lastSplit ? `<div class="boat-last-split">split : ${fmt(b.lastSplit)}</div>` : ''}
      </div>
      <div class="boat-actions">
        ${actionBtn}
        <button class="boat-act-btn ba-spl" onclick="mSplitBoat(${b.id})"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5a5 5 0 0 1 7 0a5 5 0 0 0 7 0v9a5 5 0 0 1 -7 0a5 5 0 0 0 -7 0v-9z"/><path d="M5 21v-7"/></svg>Split</button>
      </div>
    </div>
    ${chips ? `<div class="boat-chips">${chips}</div>` : ''}
  </div>`;
}

function mRenderBoat(b) { const el = document.getElementById('mboat-' + b.id); if (!el) { mRenderAll(); return; } el.outerHTML = mBoatHTML(b); }
function mRenderAll() {
  const list = document.getElementById('boats-list');
  list.innerHTML = boats.length ? boats.map(mBoatHTML).join('') : '<div class="empty-state"><strong>Aucun équipage</strong>Appuie sur Équipage pour ajouter un bateau</div>';
  document.getElementById('m-hdr') && (document.getElementById('m-hdr').textContent = boats.length + ' bateau' + (boats.length > 1 ? 'x' : ''));
  mUpdateFooter();
}
function mUpdateFooter() {
  const r = boats.filter(b => b.running).length, f = boats.filter(b => b.finished).length;
  document.getElementById('m-running').textContent = r + ' en course';
  document.getElementById('m-finished').textContent = f + ' arrivé' + (f > 1 ? 's' : '');
}

/* ══════════════════════
   SESSIONS & HISTORIQUE
══════════════════════ */
let sessions = [];
try {
  const stored = localStorage.getItem('rowtimer_sessions');
  sessions = stored ? JSON.parse(stored) : [];
  if (!Array.isArray(sessions)) sessions = [];
} catch(e) {
  sessions = [];
  localStorage.removeItem('rowtimer_sessions');
}


function saveChronoSession() {
  if (cTotalSplits === 0 && cElapsed === 0) { showToast('Aucune donnée à sauvegarder'); return; }
  const segs = [...new Set(cSplits.map(s => s.seg))];
  const s = {
    id: Date.now(),
    timestamp: Date.now(),
    label: 'Séance chrono',
    type: 'chrono',
    elapsed: cElapsed,
    segments: segs.map(seg => ({
      num: seg,
      splits: cSplits.filter(sp => sp.seg === seg).map(sp => ({ lap: sp.lap, cumul: sp.cumul, rate: sp.rate }))
    }))
  };
  sessions.unshift(s);
  try {
    localStorage.setItem('rowtimer_sessions', JSON.stringify(sessions));
    showToast('Séance sauvegardée ✓');
  } catch(e) {
    showToast('Erreur de sauvegarde — stockage plein ?');
  }
}

function saveSession() {
  if (!boats.length) { showToast('Aucun équipage à sauvegarder'); return; }
  const s = { id: Date.now(), timestamp: Date.now(), label: 'Séance multi-bateaux', boats: boats.map(b => ({ name: b.name, color: b.color, elapsed: b.elapsed, splits: [...b.splits], finished: b.finished })) };
  sessions.unshift(s);
  try {
    localStorage.setItem('rowtimer_sessions', JSON.stringify(sessions));
    showToast('Séance sauvegardée ✓');
  } catch(e) {
    showToast('Erreur de sauvegarde — stockage plein ?');
  }
}

function renderHist() {
  const c = document.getElementById('hist-content');
  if (!sessions.length) { c.innerHTML = '<div class="hist-empty"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.983 8.978c-.383 .028 -.772 .042 -1.164 .042c-3.48 0 -7 -1.12 -7 -3s3.52 -3 7 -3s7 1.12 7 3"/><path d="M11.18 17.004c-3.274 -.086 -7.18 -1.187 -7.18 -3.004v-6"/><path d="M20 12v.5"/><path d="M20 18v.01"/><path d="M3 3l18 18"/></svg>Aucune séance sauvegardée</div>'; return; }
  c.innerHTML = sessions.map(s => {
    // Chrono type
    if (s.type === 'chrono') {
      const totalSplits = s.segments ? s.segments.reduce((a, sg) => a + sg.splits.length, 0) : 0;
      const segsHTML = s.segments ? s.segments.map(sg =>
        `<div class="sess-boat"><div class="sess-boat-dot" style="background:var(--green)"></div><span class="sess-boat-name">Segment ${sg.num}</span><span class="sess-boat-t">${fmt(sg.splits.reduce((a,sp)=>a+sp.lap,0))}</span><span class="sess-boat-s">${sg.splits.length} split${sg.splits.length>1?'s':''}</span></div>`
      ).join('') : '';
      return `<div class="sess-card">
        <div class="sess-top"><span class="sess-name"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="font-size:12px;vertical-align:-1px;margin-right:4px"><path d="M10 2h4"/><path d="M12 14m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"/><path d="M12 10v4l2 2"/><path d="M5.5 5.5l-1 1"/><path d="M12 6v-4"/></svg>${s.label}</span><span class="sess-dt">${fmtDate(s.timestamp)}</span></div>
        <div class="sess-stats">
          <div class="sess-stat"><span class="sess-stat-v">${fmt(s.elapsed)}</span><span class="sess-stat-l">temps total</span></div>
          <div class="sess-stat"><span class="sess-stat-v">${totalSplits}</span><span class="sess-stat-l">splits</span></div>
          <div class="sess-stat"><span class="sess-stat-v">${s.segments ? s.segments.length : 0}</span><span class="sess-stat-l">segments</span></div>
        </div>
        <div class="sess-boats-list">${segsHTML}</div>
        <div class="sess-acts">
          <button class="sess-act" onclick="exportChronoCSV(${s.id})"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 20h-5.5a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v7.5"/><path d="M16 19h6"/><path d="M19 16l3 3l-3 3"/><path d="M4 10h16"/><path d="M10 4v16"/></svg>CSV</button>
          <button class="sess-act" onclick="exportChronoPDF(${s.id})"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12m0 1a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1z"/><path d="M9 8m0 1a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1z"/><path d="M15 4m0 1a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1z"/><path d="M4 20l14 0"/></svg>PDF</button>
          <button class="sess-act del" onclick="deleteSession(${s.id})"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l16 0"/><path d="M10 11l0 6"/><path d="M14 11l0 6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"/></svg>Supprimer</button>
        </div>

    }
    // Multi type
    const totalSplits = s.boats ? s.boats.reduce((a, b) => a + b.splits.length, 0) : 0;
    const best = s.boats ? s.boats.reduce((a, b) => (!a || b.elapsed < a.elapsed) ? b : a, null) : null;
    const boatsHTML = s.boats ? s.boats.map(b => `<div class="sess-boat"><div class="sess-boat-dot" style="background:${b.color}"></div><span class="sess-boat-name">${b.name}</span><span class="sess-boat-t">${fmt(b.elapsed)}</span><span class="sess-boat-s">${b.splits.length} split${b.splits.length > 1 ? 's' : ''}</span></div>`).join('') : '';

        <button class="sess-act del" onclick="deleteSession(${s.id})"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l16 0"/><path d="M10 11l0 6"/><path d="M14 11l0 6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"/></svg>Supprimer</button>
      </div>

  }).join('');
}

function deleteSession(id) {
  sessions = sessions.filter(s => s.id !== id);
  try { localStorage.setItem('rowtimer_sessions', JSON.stringify(sessions)); } catch(e) {}
  renderHist(); showToast('Séance supprimée');
}

/* ══ EXPORT CHRONO CSV ══ */
function exportChronoCSV(id) {
  const s = sessions.find(x => x.id === id); if (!s) return;
  let csv = 'Séance chrono;' + fmtDate(s.timestamp) + '\n\n';
  csv += 'Temps total;' + fmt(s.elapsed) + '\n\n';
  if (s.segments) {
    s.segments.forEach(sg => {
      csv += 'Segment ' + sg.num + '\n';
      csv += 'Split #;Temps au tour;Cadence (spm);Cumulé\n';
      let c = 0;
      sg.splits.forEach((sp, i) => {
        c += sp.lap;
        csv += `${i+1};${fmt(sp.lap)};${sp.rate || '—'};${fmt(c)}\n`;
      });
      csv += '\n';
    });
  }
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = 'chrono_' + s.id + '.csv'; a.click(); URL.revokeObjectURL(url);
  showToast('CSV téléchargé');
}

/* ══ EXPORT CHRONO PDF ══ */
function exportChronoPDF(id) {
  const s = sessions.find(x => x.id === id); if (!s) return;
  const totalSplits = s.segments ? s.segments.reduce((a, sg) => a + sg.splits.length, 0) : 0;

  // Tableau résumé segments
  const segRows = s.segments ? s.segments.map(sg => {
    const times = sg.splits.map(sp => sp.lap);
    const best = times.length ? Math.min(...times) : null;
    const avg = times.length ? times.reduce((a,v)=>a+v,0)/times.length : null;
    const total = times.reduce((a,v)=>a+v,0);
    return `<tr>
      <td style="padding:7px 10px;border-bottom:1px solid #eee;font-weight:500">Segment ${sg.num}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #eee;font-family:monospace">${fmt(total)}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #eee;text-align:center">${sg.splits.length}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #eee;font-family:monospace">${best ? fmt(best) : '—'}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #eee;font-family:monospace">${avg ? fmt(avg) : '—'}</td>
    </tr>`;
  }).join('') : '';

  // Détail splits
  let splitsRows = '';
  if (s.segments) {
    s.segments.forEach(sg => {
      let c = 0;
      sg.splits.forEach((sp, i) => {
        c += sp.lap;
        splitsRows += `<tr>
          <td style="padding:4px 10px;border-bottom:1px solid #f5f5f5;color:#555">Seg ${sg.num}</td>
          <td style="padding:4px 10px;border-bottom:1px solid #f5f5f5;text-align:center;font-weight:500">${i+1}</td>
          <td style="padding:4px 10px;border-bottom:1px solid #f5f5f5;font-family:monospace">${fmt(sp.lap)}</td>
          <td style="padding:4px 10px;border-bottom:1px solid #f5f5f5;font-family:monospace;color:#888">${sp.rate ? sp.rate + ' spm' : '—'}</td>
          <td style="padding:4px 10px;border-bottom:1px solid #f5f5f5;font-family:monospace">${fmt(c)}</td>
        </tr>`;
      });
    });
  }

  // Données graphique — évolution des splits par segment
  const lineDatasets = s.segments ? s.segments.filter(sg => sg.splits.length > 0).map((sg, i) => ({
    label: 'Seg ' + sg.num,
    color: ['#1D9E75','#378ADD','#D85A30','#7F77DD','#BA7517','#D4537E'][i % 6],
    data: sg.splits.map(sp => parseFloat((sp.lap / 1000).toFixed(2)))
  })) : [];
  const maxLen = lineDatasets.length ? Math.max(...lineDatasets.map(d => d.data.length)) : 0;

  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Séance Rowtimer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"><\/script>
  <style>
    *{box-sizing:border-box}
    body{font-family:system-ui,sans-serif;max-width:780px;margin:40px auto;color:#222;padding:0 24px}
    h1{font-size:22px;font-weight:600}
    h2{font-size:15px;font-weight:600;margin:28px 0 10px;color:#333;border-bottom:1px solid #eee;padding-bottom:6px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    thead th{background:#1D9E75;color:#fff;padding:8px 10px;text-align:left;font-weight:500;font-size:12px}
    .meta{display:flex;gap:20px;margin:12px 0 20px;padding:14px 18px;background:#f8f8f8;border-radius:10px}
    .meta-item{display:flex;flex-direction:column;gap:2px}
    .meta-val{font-size:20px;font-weight:600;font-family:monospace}
    .meta-lbl{font-size:11px;color:#999}
    .chart-box{background:#f8f8f8;border-radius:10px;padding:14px;margin:16px 0}
    .chart-title{font-size:12px;font-weight:600;color:#666;margin-bottom:10px}
    .footer{margin-top:36px;font-size:11px;color:#bbb;text-align:center;border-top:1px solid #eee;padding-top:14px}
  </style>
  </head><body>
  <h1>Séance chrono</h1>
  <p style="color:#999;font-size:13px">${fmtDate(s.timestamp)}</p>
  <div class="meta">
    <div class="meta-item"><span class="meta-val">${fmt(s.elapsed)}</span><span class="meta-lbl">temps total</span></div>
    <div class="meta-item"><span class="meta-val">${totalSplits}</span><span class="meta-lbl">splits</span></div>
    <div class="meta-item"><span class="meta-val">${s.segments ? s.segments.length : 0}</span><span class="meta-lbl">segments</span></div>
  </div>
  ${lineDatasets.length ? `
  <h2>Évolution des splits</h2>
  <div class="chart-box">
    <div class="chart-title">Temps au tour par segment (secondes)</div>
    <canvas id="lineChart" height="120"></canvas>
  </div>` : ''}
  <h2>Résumé par segment</h2>
  <table><thead><tr><th>Segment</th><th>Temps total</th><th>Splits</th><th>Meilleur split</th><th>Moyenne</th></tr></thead><tbody>${segRows}</tbody></table>
  ${splitsRows ? `<h2>Détail des splits</h2><table><thead><tr><th>Seg</th><th>#</th><th>Temps au tour</th><th>Cadence</th><th>Cumulé</th></tr></thead><tbody>${splitsRows}</tbody></table>` : ''}
  <div class="footer">Rowtimer · ${fmtDate(Date.now())}</div>
  <script>
    ${lineDatasets.length ? `
    const ds = ${JSON.stringify(lineDatasets)};
    const mx = ${maxLen};
    new Chart(document.getElementById('lineChart').getContext('2d'),{
      type:'line',
      data:{
        labels:Array.from({length:mx},(_,i)=>'#'+(i+1)),
        datasets:ds.map(d=>({label:d.label,data:d.data,borderColor:d.color,backgroundColor:d.color+'22',tension:0.3,pointRadius:3,fill:false}))
      },
      options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:10},boxWidth:10,padding:8}}},scales:{y:{ticks:{callback:v=>v+'s',font:{size:11}}},x:{ticks:{font:{size:11}}}}}
    });` : ''}
  <\/script>
  </body></html>`;

  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const w = window.open(url, '_blank');
  if (w) { setTimeout(() => { w.print(); URL.revokeObjectURL(url); }, 1200); }
  else { const a = document.createElement('a'); a.href = url; a.download = 'chrono_' + s.id + '.html'; a.click(); URL.revokeObjectURL(url); }
  showToast('PDF prêt à imprimer');
}

/* ══ EXPORT CSV ══ */
function exportCSV(id) {
  const s = sessions.find(x => x.id === id); if (!s) return;
  let csv = 'Séance;' + fmtDate(s.timestamp) + '\n\n';
  csv += 'Équipage;Temps final;Splits;Meilleur split;Pire split\n';
  s.boats.forEach(b => { const best = b.splits.length ? Math.min(...b.splits) : 0, worst = b.splits.length ? Math.max(...b.splits) : 0; csv += `${b.name};${fmt(b.elapsed)};${b.splits.length};${best ? fmt(best) : '—'};${worst ? fmt(worst) : '—'}\n`; });
  csv += '\nDétail des splits\nÉquipage;Split #;Temps au tour;Temps cumulé\n';
  s.boats.forEach(b => { let c = 0; b.splits.forEach((sp, i) => { c += sp; csv += `${b.name};${i+1};${fmt(sp)};${fmt(c)}\n`; }); });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = 'seance_' + s.id + '.csv'; a.click(); URL.revokeObjectURL(url);
  showToast('CSV téléchargé');
}

  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Séance Rowtimer</title><script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"><\/script><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;max-width:780px;margin:40px auto;color:#222;padding:0 24px}h1{font-size:22px;font-weight:600}h2{font-size:15px;font-weight:600;margin:28px 0 10px;color:#333;border-bottom:1px solid #eee;padding-bottom:6px}table{width:100%;border-collapse:collapse;font-size:13px}thead th{background:#1D9E75;color:#fff;padding:8px 10px;text-align:left;font-weight:500;font-size:12px}.meta{display:flex;gap:20px;margin:12px 0 20px;padding:14px 18px;background:#f8f8f8;border-radius:10px}.meta-item{display:flex;flex-direction:column;gap:2px}.meta-val{font-size:20px;font-weight:600;font-family:monospace}.meta-lbl{font-size:11px;color:#999}.charts{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:16px 0}.chart-box{background:#f8f8f8;border-radius:10px;padding:14px}.chart-title{font-size:12px;font-weight:600;color:#666;margin-bottom:10px}.footer{margin-top:36px;font-size:11px;color:#bbb;text-align:center;border-top:1px solid #eee;padding-top:14px}</style></head><body>

  <div class="footer">Rowtimer · ${fmtDate(Date.now())}</div>
